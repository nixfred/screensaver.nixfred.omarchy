# Terminal for the ORRERY. A small font is deliberate: every glyph the
# screensaver draws is rendered into the braille dot buffer at its own
# scale, so a smaller cell buys resolution without costing legibility.
# 12pt on 1920x1200 gives roughly a 400x250 dot canvas, with dots large
# enough to read as light rather than haze.
[main]
font=JetBrainsMono Nerd Font:size=12
pad=0x0
locked-title=yes

[scrollback]
lines=0

[colors-dark]
background=0c0c0c
foreground=d7e2ea

[colors-light]
background=0c0c0c
foreground=d7e2ea
